        '500':
          $ref: '#/components/responses/500ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthenticated:
      description: Unauthenticated access attempt.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Unauthenticated.
            errors: null

    Forbidden:
      description: Forbidden - User lacks sufficient permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: This action is unauthorized.
            errors: null

    InternalServerError:
      description: Internal Server Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Failed to retrieve performance dashboard.
            errors: null
    401Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Unauthenticated. Please log in first."
            errors: null

    403Forbidden:
      description: Forbidden - Unauthorized scope or user role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "You do not have the required permissions to perform this action."
            errors: null

    422ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Validation error."
            errors:
              employee_id:
                - "The employee_id field is required."

    500ServerError:
      description: Internal server error / AI Provider Failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "AI service is currently unavailable."
            errors: null
    422RegistrationValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Validation error."
              errors:
                type: object
                nullable: true
                example:
                  email:
                    - "The email has already been taken."
          example:
            success: false
            message: "Validation error."
            errors:
              email:
                - "The email has already been taken."

    429TooManyRequests:
      description: Too Many Requests (Throttle limit exceeded)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Too many login attempts. Please try again in 46 seconds."
              errors:
                type: string
                nullable: true
                example: null
          example:
            success: false
            message: "Too many login attempts. Please try again in 46 seconds."
            errors: null

    422OtpValidationError:
      description: OTP Validation error (Invalid or expired OTP)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Validation error."
              errors:
                type: object
                properties:
                  otp:
                    type: array
                    items:
                      type: string
                    example:
                      - "Invalid or expired OTP."
          example:
            success: false
            message: "Validation error."
            errors:
              otp:
                - "Invalid or expired OTP."

    422ResetTokenValidationError:
      description: Reset Token Validation error (Invalid or expired reset token)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Validation error."
              errors:
                type: object
                properties:
                  reset_token:
                    type: array
                    items:
                      type: string
                    example:
                      - "Invalid or expired reset token."
          example:
            success: false
            message: "Validation error."
            errors:
              reset_token:
                - "Invalid or expired reset token."
    422ResendOtpValidationError:
      description: Resend OTP Validation error (Email not found)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Validation error."
              errors:
                type: object
                properties:
                  email:
                    type: array
                    items:
                      type: string
                    example:
                      - "Email not found."
          example:
            success: false
            message: "Validation error."
            errors:
              email:
                - "Email not found."
  schemas:
    EvaluationPeriod:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Q1 2026 Evaluation
        start_date:
          type: string
          format: date
          example: "2026-01-01"
        end_date:
          type: string
          format: date
          example: "2026-03-31"
        status:
          type: string
          example: active
        created_at:
          type: string
          example: "2026-01-01 10:00:00"

    EvaluationCategory:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Technical Skills
        max_score:
          type: number
          example: 10.0
        weight:
          type: number
          example: 1.5
        created_at:
          type: string
          example: "2026-01-01 10:00:00"

    Evaluation:
      type: object
      properties:
        id:
          type: integer
          example: 10
        employee_id:
          type: integer
          example: 5
        employee_name:
          type: string
          example: John Doe
        job_title:
          type: string
          example: Software Engineer
        department:
          type: string
          example: Engineering
        evaluator_id:
          type: integer
          example: 2
        evaluator_name:
          type: string
          example: Jane Smith
        period_id:
          type: integer
          example: 1
        period_name:
          type: string
          example: Q1 2026 Evaluation
        overall_score:
          type: number
          example: 95.5
        feedback:
          type: string
          example: Excellent performance throughout the quarter.
        status:
          type: string
          example: completed
        scores:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              category_id:
                type: integer
                example: 1
              category_name:
                type: string
                example: Technical Skills
              max_score:
                type: number
                example: 10
              weight:
                type: number
                example: 1.5
              score:
                type: number
                example: 9.5
        evidence:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              goal_id:
                type: integer
                example: 2
              goal_title:
                type: string
                example: Deliver Microservice Feature
              description:
                type: string
                nullable: true
        audit_logs:
          type: array
          items:
            type: object
            properties:
