        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500ServerError'

    post:
      tags:
        - Financials
      summary: Record a deduction or penalty (Owner / HR)
      description: Record a new deduction or penalty for an employee. Defaults `type` to `manual` and `status` to `queued` (pending execution in the next payroll calculation). Dispatches a push notification to the employee. Requires `create deduction` permission.
      operationId: createFinancialDeduction
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
