                        example: 15
                      name:
                        type: string
                        example: Jane Doe
                      email:
                        type: string
                        format: email
                        example: jane.doe@example.com
                      phone:
                        type: string
                        nullable: true
                        example: "+201234567890"
                      employee_code:
                        type: string
                        nullable: true
                        example: EMP-2026-84920
                      job_title:
                        type: string
                        nullable: true
                        example: Software Engineer
                      employment_type:
                        type: string
                        nullable: true
                        example: Full-time
                      start_date:
                        type: string
                        format: date
                        nullable: true
                        example: 2026-09-22
                      status:
                        type: string
                        nullable: true
                        example: Inactive
                      address:
                        type: string
                        nullable: true
                        example: Cairo, Egypt
                      avatar_url:
                        type: string
                        nullable: true
                        example:
                      role:
                        type: string
                        example: Employee
