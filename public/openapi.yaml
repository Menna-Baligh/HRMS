openapi: 3.0.3
info:
  title: HR API Documentation
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000
    description: Local Development Server
  - url: https://api.yourdomain.com
    description: Production Server (Staging/Live)
paths:
  /api/auth/login:
    post:
      summary: Login (This route is allowed for all roles)
      operationId: login
      tags:
        - Authentication
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
        - in: query
          name: lang
          required: false
          description: Language for response translation (e.g. ar, en)
          schema:
            type: string
            enum:
              - ar
              - en
            default: en
          example: en
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: noni@gmail.com
                password:
                  type: string
                  example: secret123
      responses:
        "200":
          description: Logged in successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Logged in successfully.
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      token_type:
                        type: string
                        example: bearer
                      expires_in:
                        type: string
                        example: 24 hours
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 6
                          name:
                            type: string
                            example: Noran Baligh
                          email:
                            type: string
                            format: email
                            example: noran@gmail.com
                          phone:
                            type: string
                            nullable: true
                            example: "01019018137"
                          employee_code:
                            type: string
                            nullable: true
                            example: EMP-2026-24271
                          job_title:
                            type: string
                            nullable: true
                            example: Frontend Developer
                          employment_type:
                            type: string
                            nullable: true
                            example: Part-time
                          start_date:
                            type: string
                            format: date
                            nullable: true
                            example: 2026-09-01
                          status:
                            type: string
                            nullable: true
                            example: Active
                          address:
                            type: string
                            nullable: true
                            example: null
                          avatar_url:
                            type: string
                            nullable: true
                            example: http://127.0.0.1:8000/api/files/2/download
                          role:
                            type: string
                            example: Employee
                          role_label:
                            type: string
                            nullable: true
                            example: Employee
                          locale:
                            type: string
                            example: en
                          permissions:
                            type: array
                            items:
                              type: string
                            example:
                              - View Profile
                              - Update Profile
                              - View Departments
                              - Update Task Progress
                              - Update Task Status
                              - Create Submission
                              - Attach File to Submission
                              - View Submission
                              - Resubmit Submission
                              - View Active Locations
                              - Check-in / Check-out
                              - View Personal Attendance History
                              - View Own Goals
                              - Create Goal
                              - Update Goal
                              - Update Goal Progress
                              - Complete Goal
                              - View Personal Evaluation
                              - Personal Performance Dashboard
                              - View Leave Types
                              - View Leave Balances
                              - View Own Leave Requests
                              - Create Leave Request
                              - Cancel Leave Request
                              - View Leave History
                              - View Leave Calendar
                              - Download Files
                              - Delete Files
                          created_at:
                            type: string
                            example: 2026-09-20 18:28:17
              example:
                success: true
                message: Logged in successfully.
                data:
                  access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwOi8vMTI3LjAuMC4xOjgwMDAvYXBpL2F1dGgvbG9naW4iLCJpYXQiOjE3ODk5MjU5MjgsImV4cCI6MTc5MDAxMjMyOCwibmJmIjoxNzg5OTI1OTI4LCJqdGkiOijjRFgybTV4OEVWUU9sM3JGIiwic3ViIjoiNiIsInBydiI6IjIzYmQ1Yzg5NDlmNjAwYWRiMzllNzAxYzQwMDg3MmRiN2E1OTc2ZjciLCJyb2xlIjoiRW1wbG95ZWUifQ.4DnPJEF0SlWspAYc4y6aHE8g_A9O_Hgh-je4bLDvVSM
                  token_type: bearer
                  expires_in: 24 hours
                  user:
                    id: 6
                    name: Noran Baligh
                    email: noran@gmail.com
                    phone: "01019018137"
                    employee_code: EMP-2026-24271
                    job_title: Frontend Developer
                    employment_type: Part-time
                    start_date: 2026-09-01
                    status: Active
                    address: null
                    avatar_url: http://127.0.0.1:8000/api/files/2/download
                    role: Employee
                    role_label: Employee
                    locale: en
                    permissions:
                      - View Profile
                      - Update Profile
                      - View Departments
                      - Update Task Progress
                      - Update Task Status
                      - Create Submission
                      - Attach File to Submission
                      - View Submission
                      - Resubmit Submission
                      - View Active Locations
                      - Check-in / Check-out
                      - View Personal Attendance History
                      - View Own Goals
                      - Create Goal
                      - Update Goal
                      - Update Goal Progress
                      - Complete Goal
                      - View Personal Evaluation
                      - Personal Performance Dashboard
                      - View Leave Types
                      - View Leave Balances
                      - View Own Leave Requests
                      - Create Leave Request
                      - Cancel Leave Request
                      - View Leave History
                      - View Leave Calendar
                      - Download Files
                      - Delete Files
                    created_at: 2026-09-20 18:28:17
        "403":
          description: Forbidden (e.g. Account inactive)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Your account is inactive. Please activate your account first.
                  errors:
                    nullable: true
                    example: null
        "422":
          description: Validation error or invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Validation error
                  errors:
                    type: object
                    nullable: true
              examples:
                invalidCredentials:
                  summary: Invalid Credentials
                  value:
                    success: false
                    message: Validation error
                    errors:
                      email:
                        - These credentials do not match our records.
        "429":
          description: Too Many Requests (Throttle limit exceeded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Too many login attempts. Please try again in 60 seconds.
                  errors:
                    nullable: true
                    example: null
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Something went wrong
                  errors:
                    nullable: true
                    example: null
  /api/auth/logout:
    post:
      summary: Logout (This route is allowed for all roles)
      operationId: logout
      tags:
        - Authentication
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
        - in: query
          name: lang
          required: false
          description: Language for response translation (e.g. ar, en)
          schema:
            type: string
            enum:
              - ar
              - en
            default: en
          example: en
      responses:
        "200":
          description: Successfully logged out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Logged out successfully."
                  data:
                    type: array
                    items:
                      type: string
                    example: []
              example:
                success: true
                message: "Logged out successfully."
                data: []
        "401":
          description: Missing, expired, or invalid token (Unauthenticated).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthenticated. Please log in first.
                  errors:
                    nullable: true
                    example: null
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Something went wrong
                  errors:
                    nullable: true
                    example: null

  /api/auth/google/redirect:
    get:
      summary: Google Login (Only For Role Owner)
      operationId: googleRedirect
      tags:
        - Authentication
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
      responses:
        "200":
          description: Google redirect URL generated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
              example:
                success: true
                message: Google redirect URL generated successfully
                data:
                  url: https://accounts.google.com/o/oauth2/v2/auth?client_id=123456789.apps.googleusercontent.com&redirect_uri=http%3A%2F%2Flocalhost%3A8000%2Fapi%2Fauth%2Fgoogle%2Fcallback&response_type=code&scope=openid+profile+email

  /api/permissions:
    get:
      summary: Retrieve all permissions (This route is allowed for roles Owner, HR)
      description: Returns a list of all permission labels translated based on the
        requested language. Requires authentication and Owner or HR role
      operationId: getPermissions
      tags:
        - Permissions
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
        - in: query
          name: lang
          required: false
          description: Language for response translation (e.g. ar, en)
          schema:
            type: string
            enum:
              - ar
              - en
            default: en
          example: en
      responses:
        "200":
          description: Permissions list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Permissions list retrieved successfully
                  data:
                    type: array
                    items:
                      type: string
                    example:
                      - view_dashboard
                      - manage_employees
                      - create_roles
              example:
                success: true
                message: Permissions list retrieved successfully
                data:
                  - view_dashboard
                  - manage_employees
                  - create_roles
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthenticated. Please log in first.
                  errors:
                    type: string
                    nullable: true
                    example: null
              example:
                success: false
                message: Unauthenticated. Please log in first.
                errors: null
        "403":
          description: Forbidden - User does not have Owner or HR role
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: You do not have the required permissions to perform this action.
                  errors:
                    type: string
                    nullable: true
                    example: null
              example:
                success: false
                message: You do not have the required permissions to perform this action.
                errors: null
        "500":
          description: Failed to retrieve permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Failed to retrieve permissions
                  errors:
                    type: string
                    nullable: true
                    example: null
              example:
                success: false
                message: Failed to retrieve permissions
                errors: null
  /api/employees:
    get:
      summary: List all employees
      operationId: getAllEmployees
      tags:
        - Employees
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Search by name, email, employee ID, job title, or phone
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum:
              - active
              - inactive
        - in: query
          name: department_id
          required: false
          schema:
            type: integer
        - in: query
          name: manager_id
          required: false
          schema:
            type: integer
        - in: query
          name: employment_type
          required: false
          schema:
            type: string
            enum:
              - Full-time
              - Part-time
              - Contract
        - in: query
          name: role
          required: false
          schema:
            type: string
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            default: 15
      responses:
        "200":
          description: Employees retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Employees retrieved successfully
                  data:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: John Doe
                            email:
                              type: string
                              example: john@example.com
                            phone:
                              type: string
                              nullable: true
                              example: "+1234567890"
                            avatar:
                              type: string
                              nullable: true
                              example: null
                            role:
                              type: string
                              example: Employee
                            permissions:
                              type: array
                              items:
                                type: string
                              example:
                                - employee.view-all
                      first_page_url:
                        type: string
                      from:
                        type: integer
                        nullable: true
                      last_page:
                        type: integer
                      last_page_url:
                        type: string
                      links:
                        type: array
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              nullable: true
                            label:
                              type: string
                            active:
                              type: boolean
                      next_page_url:
                        type: string
                        nullable: true
                      path:
                        type: string
                      per_page:
                        type: integer
                        example: 15
                      prev_page_url:
                        type: string
                        nullable: true
                      to:
                        type: integer
                        nullable: true
                      total:
                        type: integer
                        example: 1
    post:
      summary: Create a new employee (Allowed for Owner and HR roles)
      description: |
        Creates a new employee account and sends an invitation email.

        **Business Logic & Validation Rules:**
        - **Permissions**: Allowed for `Owner` and `HR` roles only. Only `Owner` can create `HR` accounts.
        - **Department Logic**:
          - Mandatory (`required`) for `Employee` and `Manager` roles.
          - Optional / Ignored (`nullable`) for `HR` role.
        - **Manager Auto-Assignment**:
          - Creating an `Employee` automatically sets their manager to the designated `Department` manager.
          - Creating a `Manager` automatically sets them as the head manager for that `Department` and links all department employees to them.
      operationId: storeEmployee
      tags:
        - Employees
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
        - in: query
          name: lang
          required: false
          description: Language for response translation (e.g. ar, en)
          schema:
            type: string
            enum: [ar, en]
            default: en
          example: en
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - role
                - job_title
                - employment_type
                - start_date
              properties:
                name:
                  type: string
                  maxLength: 255
                  example: Jane Doe
                email:
                  type: string
                  format: email
                  example: jane.doe@example.com
                password:
                  type: string
                  minLength: 8
                  example: Password123!
                role:
                  type: string
                  enum:
                    - HR
                    - Manager
                    - Employee
                  example: Employee
                job_title:
                  type: string
                  maxLength: 255
                  example: Software Engineer
                permissions:
                  type: array
                  items:
                    type: string
                  example:
                    - "View Profile"
                    - "Update Task Progress"
                employment_type:
                  type: string
                  enum:
                    - Full-time
                    - Part-time
                    - Contract
                  example: Full-time
                start_date:
                  type: string
                  format: date
                  example: "2026-09-22"
                department_id:
                  type: integer
                  nullable: true
                  description: Required if role is Employee or Manager. Optional/Null for HR.
                  example: 1
                phone:
                  type: string
                  maxLength: 20
                  nullable: true
                  example: "+201234567890"
                address:
                  type: string
                  nullable: true
                  example: "Cairo, Egypt"
                
      responses:
        '201':
          description: Employee created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Employee created successfully.
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 15
                      name:
                        type: string
                        example: Jane Doe
                      email:
                        type: string
                        format: email
                        example: jane.doe@example.com
                      phone:
                        type: string
                        nullable: true
                        example: "+201234567890"
                      employee_code:
                        type: string
                        example: EMP-2026-84920
                      job_title:
                        type: string
                        example: Software Engineer
                      employment_type:
                        type: string
                        example: Full-time
                      start_date:
                        type: string
                        format: date
                        example: "2026-09-22"
                      status:
                        type: string
                        example: Inactive
                      address:
                        type: string
                        nullable: true
                        example: "Cairo, Egypt"
                      avatar_url:
                        type: string
                        nullable: true
                        example: null
                      role:
                        type: string
                        example: Employee
                      role_label:
                        type: string
                        example: Employee
                      locale:
                        type: string
                        example: en
                      department:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: Engineering
                      company_location:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: Headquarter
                      manager:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: integer
                            example: 2
                          name:
                            type: string
                            example: John Manager
                      permissions:
                        type: array
                        items:
                          type: string
                        example:
                          - "View Profile"
                          - "Update Task Progress"
                      created_at:
                        type: string
                        example: "2026-09-22 12:15:00"
              example:
                success: true
                message: Employee created successfully.
                data:
                  id: 15
                  name: "Jane Doe"
                  email: "jane.doe@example.com"
                  phone: "+201234567890"
                  employee_code: "EMP-2026-84920"
                  job_title: "Software Engineer"
                  employment_type: "Full-time"
                  start_date: "2026-09-22"
                  status: "Inactive"
                  address: "Cairo, Egypt"
                  avatar_url: null
                  role: "Employee"
                  role_label: "Employee"
                  locale: "en"
                  department:
                    id: 1
                    name: "Engineering"
                  company_location:
                    id: 1
                    name: "Headquarter"
                  manager:
                    id: 2
                    name: "John Manager"
                  permissions:
                    - "View Profile"
                    - "Update Task Progress"
                  created_at: "2026-09-22 12:15:00"
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Forbidden (User is not Owner or HR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "You do not have the required permissions to perform this action."
                errors: null
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingDepartment:
                  summary: Missing Department for Employee/Manager
                  value:
                    success: false
                    message: "Validation error."
                    errors:
                      department_id:
                        - "The department field is required when role is Employee or Manager."
                onlyOwnerCanCreateHR:
                  summary: Non-Owner creating HR Role
                  value:
                    success: false
                    message: "Validation error."
                    errors:
                      role:
                        - "Only system owners can create HR accounts."
                emailTaken:
                  summary: Email Already Taken
                  value:
                    success: false
                    message: "Validation error."
                    errors:
                      email:
                        - "The email address has already been taken."
        '500':
          description: Internal Server Error (Failed to create employee)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Failed to create employee account."
                errors: null
  /api/employees/profile:
    patch:
      summary: Update authenticated user's profile
      operationId: updateProfile
      tags:
        - Employees
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                  nullable: true
                  example: Jane Doe
                phone:
                  type: string
                  maxLength: 20
                  nullable: true
                  example: "+1234567890"
                address:
                  type: string
                  maxLength: 500
                  nullable: true
                  example: 456 Oak St
                avatar:
                  type: string
                  format: binary
                  nullable: true
                  description: Profile image file (jpeg, png, jpg, gif, svg, max 2048KB)
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Profile updated successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      employee_id:
                        type: string
                        example: EMP-2026-00001
                      name:
                        type: string
                        example: Jane Doe
                      email:
                        type: string
                        example: jane@example.com
                      role:
                        type: string
                        example: Employee
                      avatar:
                        type: string
                        nullable: true
                        example: avatars/sample.jpg
                      job_title:
                        type: string
                        example: Software Engineer
                      employment_type:
                        type: string
                        example: Full-time
                      status:
                        type: string
                        example: active
                      start_date:
                        type: string
                        format: date
                        example: 2026-01-15
                      phone:
                        type: string
                        nullable: true
                        example: "+1234567890"
                      address:
                        type: string
                        nullable: true
                        example: 456 Oak St
                      department:
                        type: string
                        nullable: true
                        example: Engineering
                      manager:
                        type: object
                        nullable: true
                      created_at:
                        type: string
                        example: 2026-09-10 21:30:00
                      permissions:
                        type: array
                        items:
                          type: string
        "404":
          description: Employee profile not found for this user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
