openapi: 3.0.3
info:
  title: HR API Documentation
  version: 1.0.0
paths:
  /api/auth/login:
    post:
      summary: Login
      operationId: login
      tags:
        - Authentication
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  example: secret123
      responses:
        '200':
          description: Login successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Login successfully
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      token_type:
                        type: string
                        example: bearer
                      expires_in:
                        type: string
                        example: 24 hours
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: John Doe
                          email:
                            type: string
                            format: email
                            example: user@example.com
                          phone:
                            type: string
                            nullable: true
                            example: null
                          avatar:
                            type: string
                            nullable: true
                            example: null
                          role:
                            type: string
                            example: Employee
                          permissions:
                            type: array
                            items:
                              type: string
                            example:
                              - view_dashboard
                              - create_posts
              example:
                success: true
                message: Login successfully
                data:
                  access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwOi8vMTI3LjAuMC4xOjgwMDAvYXBpL2F1dGgvbG9naW4iLCJpYXQiOjE3ODg4NjA0NzksImV4cCI6MTc4ODk0Njg3OSwibmJmIjoxNzg4ODYwNDc5LCJqdGkiOiI4ZERjNW1YUURoWHZSUUN2Iiwic3ViIjoiMSIsInBydiI6IjIzYmQ1Yzg5NDlmNjAwYWRiMzllNzAxYzQwMDg3MmRiN2E1OTc2ZjcifQ.gk2rVSgLGfCCfbx3PniTWxIqBzgahTEr7fGmyAzE_wc
                  token_type: bearer
                  expires_in: 24 hours
                  user:
                    id: 1
                    name: John Doe
                    email: user@example.com
                    phone: null
                    avatar: null
                    role: Employee
                    permissions:
                      - view_dashboard
                      - create_posts
        '422':
          description: Validation error or authentication failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Validation error
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
              examples:
                missingFields:
                  summary: Missing Required Fields
                  value:
                    success: false
                    message: Validation error
                    errors:
                      email:
                        - The email field is required.
                      password:
                        - The password field is required.
                invalidCredentials:
                  summary: Invalid Credentials
                  value:
                    success: false
                    message: Validation error
                    errors:
                      email:
                        - These credentials do not match our records.
                inactiveAccount:
                  summary: Inactive Account
                  value:
                    success: false
                    message: Validation error
                    errors:
                      email:
                        - Your account is inactive. Please activate your account first.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Something went wrong
                  errors:
                    nullable: true
              example:
                success: false
                message: Something went wrong
                errors: null

  /api/auth/logout:
    post:
      summary: Logout
      operationId: logout
      tags:
        - Authentication
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
      responses:
        '200':
          description: Successfully logged out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items: {}
              example:
                success: true
                message: Logged out successfully
                data: []
        '401':
          description: Missing, expired, or invalid token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  errors:
                    type: string
                    nullable: true
              example:
                success: false
                message: Unauthenticated
                errors: null

  /api/auth/google/redirect:
    get:
      summary: Google Login Redirect
      operationId: googleRedirect
      tags:
        - Authentication
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
      responses:
        '200':
          description: Google redirect URL generated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
              example:
                success: true
                message: Google redirect URL generated successfully
                data:
                  url: https://accounts.google.com/o/oauth2/v2/auth?client_id=123456789.apps.googleusercontent.com&redirect_uri=http%3A%2F%2Flocalhost%3A8000%2Fapi%2Fauth%2Fgoogle%2Fcallback&response_type=code&scope=openid+profile+email

  /api/auth/google/callback:
    get:
      summary: Google Login Callback
      operationId: googleCallback
      tags:
        - Authentication
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
        - in: query
          name: code
          required: false
          description: Authorization code provided by Google OAuth.
          schema:
            type: string
        - in: query
          name: state
          required: false
          description: State parameter for CSRF mitigation.
          schema:
            type: string
      responses:
        '200':
          description: Logged in with Google successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      token_type:
                        type: string
                      expires_in:
                        type: string
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          email:
                            type: string
                          phone:
                            type: string
                            nullable: true
                          avatar:
                            type: string
                            nullable: true
                          role:
                            type: string
              example:
                success: true
                message: Logged in with Google successfully
                data:
                  access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                  token_type: bearer
                  expires_in: 1 hours
                  user:
                    id: 1
                    name: Company Owner
                    email: owner@example.com
                    phone: null
                    avatar: null
                    role: Owner
        '422':
          description: Validation or process error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
              example:
                success: false
                message: Google authentication failed
                errors:
                  email:
                    - Google authentication failed

  /permissions:
    get:
      summary: Retrieve all permissions
      description: Returns a list of all permission names configured for the 'api' guard. Requires authentication and Owner or HR role.
      operationId: getPermissions
      tags:
        - Permissions
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
      responses:
        '200':
          description: Permissions list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Permissions list retrieved successfully
                  data:
                    type: array
                    items:
                      type: string
                    example:
                      - view_dashboard
                      - manage_employees
                      - create_roles
              example:
                success: true
                message: Permissions list retrieved successfully
                data:
                  - view_dashboard
                  - manage_employees
                  - create_roles
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthenticated
                  errors:
                    nullable: true
              example:
                success: false
                message: Unauthenticated
                errors: null
        '403':
          description: Forbidden - User does not have Owner or HR role
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: User does not have the right roles.
                  errors:
                    nullable: true
              example:
                success: false
                message: User does not have the right roles.
                errors: null
        '500':
          description: Failed to retrieve permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Failed to retrieve permissions
                  errors:
                    nullable: true
              example:
                success: false
                message: Failed to retrieve permissions
                errors: null

  /employees:
    get:
      summary: List all employees
      operationId: getAllEmployees
      tags:
        - Employees
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Search by name, email, employee ID, job title, or phone
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [active, inactive]
        - in: query
          name: department_id
          required: false
          schema:
            type: integer
        - in: query
          name: manager_id
          required: false
          schema:
            type: integer
        - in: query
          name: employment_type
          required: false
          schema:
            type: string
            enum: [Full-time, Part-time, Contract]
        - in: query
          name: role
          required: false
          schema:
            type: string
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Employees retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Employees retrieved successfully
                  data:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: John Doe
                            email:
                              type: string
                              example: john@example.com
                            phone:
                              type: string
                              nullable: true
                              example: "+1234567890"
                            avatar:
                              type: string
                              nullable: true
                              example: null
                            role:
                              type: string
                              example: Employee
                            permissions:
                              type: array
                              items:
                                type: string
                              example: ["employee.view-all"]
                      first_page_url:
                        type: string
                      from:
                        type: integer
                        nullable: true
                      last_page:
                        type: integer
                      last_page_url:
                        type: string
                      links:
                        type: array
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              nullable: true
                            label:
                              type: string
                            active:
                              type: boolean
                      next_page_url:
                        type: string
                        nullable: true
                      path:
                        type: string
                      per_page:
                        type: integer
                        example: 15
                      prev_page_url:
                        type: string
                        nullable: true
                      to:
                        type: integer
                        nullable: true
                      total:
                        type: integer
                        example: 1

    post:
      summary: Create a new employee
      operationId: storeEmployee
      tags:
        - Employees
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - role
                - job_title
                - employment_type
                - start_date
              properties:
                name:
                  type: string
                  maxLength: 255
                  example: Jane Doe
                email:
                  type: string
                  format: email
                  example: jane.doe@example.com
                password:
                  type: string
                  minLength: 8
                  example: password123
                role:
                  type: string
                  enum: [HR, Manager, Employee]
                  example: Employee
                job_title:
                  type: string
                  maxLength: 255
                  example: Software Engineer
                permissions:
                  type: array
                  items:
                    type: string
                  example: ["employee.view-all"]
                employment_type:
                  type: string
                  enum: [Full-time, Part-time, Contract]
                  example: Full-time
                start_date:
                  type: string
                  format: date
                  example: "2026-01-15"
                department_id:
                  type: integer
                  nullable: true
                  example: 1
                manager_id:
                  type: integer
                  nullable: true
                  example: 2
                phone:
                  type: string
                  maxLength: 20
                  nullable: true
                  example: "+1234567890"
                address:
                  type: string
                  nullable: true
                  example: "123 Main St"
      responses:
        '201':
          description: Employee created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Employee created successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      employee_id:
                        type: string
                        example: "EMP-2026-00001"
                      name:
                        type: string
                        example: Jane Doe
                      email:
                        type: string
                        format: email
                        example: jane.doe@example.com
                      role:
                        type: string
                        example: Employee
                      avatar:
                        type: string
                        nullable: true
                        example: null
                      job_title:
                        type: string
                        example: Software Engineer
                      employment_type:
                        type: string
                        example: Full-time
                      status:
                        type: string
                        example: inactive
                      start_date:
                        type: string
                        format: date
                        example: "2026-01-15"
                      phone:
                        type: string
                        nullable: true
                        example: "+1234567890"
                      address:
                        type: string
                        nullable: true
                        example: "123 Main St"
                      department:
                        type: string
                        nullable: true
                        example: Engineering
                      manager:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: integer
                            example: 2
                          employee_id:
                            type: string
                            example: "EMP-2026-00002"
                          name:
                            type: string
                            example: John Manager
                      created_at:
                        type: string
                        example: "2026-09-10 21:30:00"
                      permissions:
                        type: array
                        items:
                          type: string
                        example: ["employee.view-all"]
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Validation error
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
              examples:
                emailTaken:
                  summary: Email Already Taken
                  value:
                    success: false
                    message: Validation error
                    errors:
                      email:
                        - The email address is already in use.
                invalidRole:
                  summary: Invalid Role Selected
                  value:
                    success: false
                    message: Validation error
                    errors:
                      role:
                        - "The selected role is invalid. Allowed roles are: HR, Manager, Employee."
        '500':
          description: Failed to create employee
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Failed to create employee
                  errors:
                    nullable: true

  /employees/profile:
    patch:
      summary: Update authenticated user's profile
      operationId: updateProfile
      tags:
        - Employees
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                  nullable: true
                  example: Jane Doe
                phone:
                  type: string
                  maxLength: 20
                  nullable: true
                  example: "+1234567890"
                address:
                  type: string
                  maxLength: 500
                  nullable: true
                  example: "456 Oak St"
                avatar:
                  type: string
                  format: binary
                  nullable: true
                  description: Profile image file (jpeg, png, jpg, gif, svg, max 2048KB)
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Profile updated successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      employee_id:
                        type: string
                        example: "EMP-2026-00001"
                      name:
                        type: string
                        example: Jane Doe
                      email:
                        type: string
                        example: jane@example.com
                      role:
                        type: string
                        example: Employee
                      avatar:
                        type: string
                        nullable: true
                        example: "avatars/sample.jpg"
                      job_title:
                        type: string
                        example: Software Engineer
                      employment_type:
                        type: string
                        example: Full-time
                      status:
                        type: string
                        example: active
                      start_date:
                        type: string
                        format: date
                        example: "2026-01-15"
                      phone:
                        type: string
                        nullable: true
                        example: "+1234567890"
                      address:
                        type: string
                        nullable: true
                        example: "456 Oak St"
                      department:
                        type: string
                        nullable: true
                        example: Engineering
                      manager:
                        type: object
                        nullable: true
                      created_at:
                        type: string
                        example: "2026-09-10 21:30:00"
                      permissions:
                        type: array
                        items:
                          type: string
        '404':
          description: Employee profile not found for this user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Employee profile not found for this user.
                  errors:
                    nullable: true
        '500':
          description: Failed to update profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Failed to update profile
                  errors:
                    nullable: true

  /employees/{id}:
    get:
      summary: Retrieve employee details
      operationId: getEmployeeById
      tags:
        - Employees
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Employee ID
      responses:
        '200':
          description: Employee details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Employee details retrieved successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      employee_id:
                        type: string
                        example: "EMP-2026-00001"
                      name:
                        type: string
                        example: Jane Doe
                      email:
                        type: string
                        example: jane@example.com
                      role:
                        type: string
                        example: Employee
                      avatar:
                        type: string
                        nullable: true
                      job_title:
                        type: string
                        example: Software Engineer
                      employment_type:
                        type: string
                        example: Full-time
                      status:
                        type: string
                        example: active
                      start_date:
                        type: string
                        format: date
                        example: "2026-01-15"
                      phone:
                        type: string
                        nullable: true
                        example: "+1234567890"
                      address:
                        type: string
                        nullable: true
                        example: "123 Main St"
                      department:
                        type: string
                        nullable: true
                        example: Engineering
                      manager:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: integer
                            example: 2
                          employee_id:
                            type: string
                            example: "EMP-2026-00002"
                          name:
                            type: string
                            example: John Manager
                      created_at:
                        type: string
                        example: "2026-09-10 21:30:00"
                      permissions:
                        type: array
                        items:
                          type: string
        '403':
          description: Forbidden - Not authorized to view profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: You are not authorized to view this employee profile.
                  errors:
                    nullable: true
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Employee not found.
                  errors:
                    nullable: true
        '500':
          description: Failed to retrieve employee details

  /employees/{id}/hr-fields:
    patch:
      summary: Update HR fields of an employee
      operationId: updateEmployeeHrFields
      tags:
        - Employees
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Employee ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                job_title:
                  type: string
                  maxLength: 255
                  example: Senior Software Engineer
                employment_type:
                  type: string
                  enum: [Full-time, Part-time, Contract]
                  example: Full-time
                status:
                  type: string
                  enum: [active, inactive]
                  example: active
                department_id:
                  type: integer
                  nullable: true
                  example: 1
                manager_id:
                  type: integer
                  nullable: true
                  example: 2
      responses:
        '200':
          description: Employee HR fields updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Employee HR fields updated successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      employee_id:
                        type: string
                        example: "EMP-2026-00001"
                      name:
                        type: string
                        example: Jane Doe
                      email:
                        type: string
                        example: jane@example.com
                      role:
                        type: string
