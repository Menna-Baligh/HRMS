        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: The unique ID of the notification to delete.
          schema:
            type: string
          example: "1"
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
        - in: header
          name: Accept-Language
          required: false
          schema:
            type: string
            enum:
              - ar
              - en
            default: en
          example: en
      responses:
        "200":
          description: Notification deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Notification deleted successfully.
                  data:
                    type: string
                    nullable: true
                    example: null
              example:
                success: true
                message: Notification deleted successfully.
                data: null
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthenticated
              example:
                success: false
                message: Unauthenticated
        "403":
          description: Unauthorized to delete this notification
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthorized to access this notification.
              example:
                success: false
                message: Unauthorized to access this notification.
        "404":
          description: Notification not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Notification not found.
              example:
                success: false
                message: Notification not found.
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Failed to delete notification.
              example:
                success: false
                message: Failed to delete notification.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthenticated:
      description: Unauthenticated access attempt.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Unauthenticated.
            errors: null
    Forbidden:
      description: Forbidden - User lacks sufficient permissions.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: This action is unauthorized.
            errors: null
    InternalServerError:
      description: Internal Server Error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Failed to retrieve performance dashboard.
            errors: null
    401Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Unauthenticated. Please log in first.
    403Forbidden:
      description: Forbidden - Unauthorized scope or user role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: You do not have the required permissions to perform this action.
    422ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Validation error.
            errors:
              employee_id:
                - The employee_id field is required.
    500ServerError:
      description: Internal server error / AI Provider Failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: service is currently unavailable.
    422RegistrationValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Validation error.
              errors:
                type: object
                nullable: true
                example:
                  email:
                    - The email has already been taken.
          example:
            success: false
            message: Validation error.
            errors:
              email:
                - The email has already been taken.
    429TooManyRequests:
      description: Too Many Requests (Throttle limit exceeded)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Too many login attempts. Please try again in 46 seconds.
