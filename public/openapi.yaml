  /api/notifications/fcm-token:
    post:
      summary: Update Firebase Cloud Messaging (FCM) token for push notifications
      operationId: updateFcmToken
      tags:
        - Notifications
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fcm_token
              properties:
                fcm_token:
                  type: string
                  example: "c-xxxxxxxx:APA91bF..."
      responses:
        '200':
          description: FCM Token updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: FCM Token updated successfully
                  data:
                    nullable: true
                    example: null
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/broadcasting/auth:
    post:
      summary: Authorize user for Reverb/Laravel broadcasting channels
      operationId: broadcastingAuth
      tags:
        - Broadcasting
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - socket_id
                - channel_name
              properties:
                socket_id:
                  type: string
                  example: "12345.67890"
                channel_name:
                  type: string
                  example: "private-notifications.user_id"
      responses:
        '200':
          description: Broadcasting authorization successful.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                auth: "c29986... signature string"
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden / Channel unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/files/{file}/download:
    get:
      summary: Download a specific file securely via permissions or policy
      operationId: downloadFile
      tags:
        - Files
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
        - in: path
          name: file
          required: true
          schema:
            type: integer
          description: ID of the file record
          example: 1
      responses:
        '200':
          description: File stream or binary file downloaded successfully.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Unauthorized access to file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: File download failed due to server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/files/{file}:
    delete:
      summary: Delete a specific file from storage and database
      operationId: deleteFile
      tags:
        - Files
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
        - in: path
          name: file
          required: true
          schema:
            type: integer
          description: ID of the file record
          example: 1
      responses:
        '200':
          description: File deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "File deleted successfully"
                  data:
                    type: array
                    example: []
          example:
            success: true
            message: "File deleted successfully"
            data: []
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Unauthorized delete access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: File delete failed due to server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'



components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthenticated:
      description: Unauthenticated access attempt.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Unauthenticated.
            errors: null

    Forbidden:
      description: Forbidden - User lacks sufficient permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: This action is unauthorized.
            errors: null

    InternalServerError:
      description: Internal Server Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Failed to retrieve performance dashboard.
            errors: null
  schemas:
    EvaluationPeriod:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Q1 2026 Evaluation
        start_date:
          type: string
          format: date
          example: "2026-01-01"
        end_date:
          type: string
          format: date
          example: "2026-03-31"
        status:
          type: string
          example: active
        created_at:
          type: string
          example: "2026-01-01 10:00:00"

    EvaluationCategory:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Technical Skills
        max_score:
          type: number
          example: 10.0
        weight:
          type: number
          example: 1.5
        created_at:
          type: string
          example: "2026-01-01 10:00:00"

    Evaluation:
      type: object
      properties:
        id:
          type: integer
          example: 10
        employee_id:
          type: integer
          example: 5
        employee_name:
          type: string
          example: John Doe
        job_title:
          type: string
          example: Software Engineer
        department:
          type: string
          example: Engineering
        evaluator_id:
          type: integer
          example: 2
        evaluator_name:
          type: string
          example: Jane Smith
        period_id:
          type: integer
          example: 1
        period_name:
          type: string
          example: Q1 2026 Evaluation
        overall_score:
          type: number
          example: 95.5
        feedback:
          type: string
          example: Excellent performance throughout the quarter.
        status:
          type: string
          example: completed
        scores:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              category_id:
                type: integer
                example: 1
              category_name:
                type: string
                example: Technical Skills
              max_score:
                type: number
                example: 10
              weight:
                type: number
                example: 1.5
              score:
                type: number
                example: 9.5
        evidence:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              goal_id:
                type: integer
                example: 2
              goal_title:
                type: string
                example: Deliver Microservice Feature
              description:
                type: string
                nullable: true
        audit_logs:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              action:
                type: string
                example: completed
              performed_by:
                type: string
                example: Jane Smith
              details:
                type: object
              created_at:
                type: string
                example: "2026-03-31 15:30:00"
        created_at:
          type: string
          example: "2026-03-01 09:00:00"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: An error occurred processing the request.
        errors:
