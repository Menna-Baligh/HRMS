  /api/auth/logout:
    post:
      summary: Logout (This route is allowed for all roles) 📱
      operationId: logout
      tags:
      - Authentication
      security:
      - bearerAuth: []
      parameters:
      - in: header
        name: Accept
        required: true
        schema:
          type: string
          default: application/json
        example: application/json
      - in: header
        name: Accept-Language
        required: false
        schema:
          type: string
          enum:
          - ar
          - en
      - in: query
        name: lang
        required: false
        description: Language for response translation (e.g. ar, en)
        schema:
          type: string
          enum:
          - ar
          - en
          default: en
        example: en
      responses:
        "200":
          description: Successfully logged out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Logged out successfully.
                  data:
                    type: array
                    items:
                      type: string
                    example: []
              example:
                success: true
                message: Logged out successfully.
                data: []
        "401":
          description: Missing, expired, or invalid token (Unauthenticated).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthenticated. Please log in first.
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Something went wrong
  /api/auth/google/redirect:
    get:
      summary: Google Login (Only For Role Owner)
      operationId: googleRedirect
      tags:
      - Authentication
      parameters:
      - in: header
        name: Accept
        required: true
        schema:
          type: string
          default: application/json
        example: application/json
      - in: header
        name: Accept-Language
        required: false
        schema:
          type: string
          enum:
          - ar
          - en
      responses:
        "200":
          description: Google redirect URL generated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
              example:
                success: true
                message: Google redirect URL generated successfully
                data:
                  url: https://accounts.google.com/o/oauth2/v2/auth?client_id=123456789.apps.googleusercontent.com&redirect_uri=http%3A%2F%2Flocalhost%3A8000%2Fapi%2Fauth%2Fgoogle%2Fcallback&response_type=code&scope=openid+profile+email
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/permissions:
    get:
      summary: Retrieve all permissions (This route is allowed for roles Owner, HR)
      description: Returns a list of all permission labels translated based on the requested language. Requires authentication and Owner or HR role
      operationId: getPermissions
      tags:
      - Permissions
      security:
      - bearerAuth: []
      parameters:
      - in: header
        name: Accept
        required: true
        schema:
          type: string
          default: application/json
        example: application/json
      - in: header
        name: Accept-Language
        required: false
        schema:
          type: string
          enum:
          - ar
          - en
      - in: query
        name: lang
        required: false
        description: Language for response translation (e.g. ar, en)
        schema:
          type: string
          enum:
          - ar
          - en
          default: en
        example: en
      responses:
        "200":
          description: Permissions list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Permissions list retrieved successfully
                  data:
                    type: array
                    items:
                      type: string
                    example:
                    - view_dashboard
                    - manage_employees
                    - create_roles
              example:
                success: true
                message: Permissions list retrieved successfully
                data:
                - view_dashboard
                - manage_employees
                - create_roles
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthenticated. Please log in first.
              example:
                success: false
                message: Unauthenticated. Please log in first.
        "403":
          description: Forbidden - User does not have Owner or HR role
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: You do not have the required permissions to perform this action.
              example:
                success: false
                message: You do not have the required permissions to perform this action.
        "500":
          description: Failed to retrieve permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Failed to retrieve permissions
              example:
                success: false
                message: Failed to retrieve permissions
  /api/employees:
    get:
      summary: "List all employees (This Route Allowed For Owner / HR Only)"
      description: "Retrieve a paginated list of employees with optional filters for search, status, department, manager, employment type, and role."
      operationId: getAllEmployees
      tags:
      - Employees
      security:
      - bearerAuth: []
      parameters:
      - in: header
        name: Accept
        required: true
        schema:
          type: string
          default: application/json
        example: application/json
      - in: header
        name: Accept-Language
        required: false
        schema:
          type: string
          enum:
          - ar
          - en
      - in: query
        name: search
        required: false
        description: Search by name, email, employee ID, job title, or phone
        schema:
          type: string
        example: John
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - Active
          - Inactive
        example: Active
      - in: query
        name: department_id
        required: false
        schema:
          type: integer
        example: 1
      - in: query
        name: manager_id
        required: false
        schema:
          type: integer
        example: 3
      - in: query
        name: employment_type
        required: false
        schema:
          type: string
          enum:
          - Full-time
          - Part-time
          - Contract
        example: Full-time
      - in: query
        name: role
        required: false
        schema:
          type: string
        example: Employee
      - in: query
        name: per_page
        required: false
        schema:
          type: integer
          default: 15
        example: 15
      - in: query
        name: page
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      responses:
        "200":
          description: Employees retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Employees retrieved successfully.
