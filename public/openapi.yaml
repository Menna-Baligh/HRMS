      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Submission retrieved successfully."
        data:
          $ref: '#/components/schemas/Submission'

    SubmissionAttachmentResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "File attached successfully."
        data:
          $ref: '#/components/schemas/SubmissionAttachment'

    SubmissionDetails:
      allOf:
        - $ref: '#/components/schemas/Submission'
        - type: object
          properties:
            task:
              $ref: '#/components/schemas/Task'
            user:
              type: object
              properties:
                id:
                  type: integer
                  example: 10
                name:
                  type: string
                  example: "Ahmed Mohamed"
                email:
                  type: string
                  format: email
                  example: "ahmed@example.com"
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/SubmissionAttachment'
            reviews:
              type: array
              items:
                $ref: '#/components/schemas/SubmissionReview'

    SubmissionDetailsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Submission retrieved successfully."
        data:
          $ref: '#/components/schemas/SubmissionDetails'

    SubmissionListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Submission review queue retrieved successfully."
        data:
          type: object
          properties:
            current_page:
              type: integer
              example: 1
            data:
              type: array
              items:
                $ref: '#/components/schemas/Submission'
            per_page:
              type: integer
              example: 15
            total:
              type: integer
              example: 1
            last_page:
              type: integer
              example: 1

    StoreSubmissionRequest:
      type: object
      required:
        - note
      properties:
        note:
          type: string
          example: "Completed the assigned task."
        files:
          type: array
          items:
            type: string
            format: binary
          description: Optional files to attach to the submission.

    AttachSubmissionFileRequest:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: The file to attach to the submission.

    RejectSubmissionRequest:
      type: object
      required:
        - feedback
      properties:
        feedback:
          type: string
          example: "Please provide more details about the completed work."

    RequestChangesRequest:
      type: object
      required:
        - feedback
      properties:
        feedback:
          type: string
          example: "Please update the attached document and resubmit it."

    ResubmitSubmissionRequest:
      type: object
      properties:
        note:
          type: string
          nullable: true
          example: "Updated the submission based on the requested changes."

    FileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "File uploaded successfully."
        data:
          type: object
          properties:
            id:
              type: integer
              example: 1
            file_name:
              type: string
              example: "document.pdf"
            file_path:
              type: string
              example: "uploads/document.pdf"
            mime_type:
              type: string
              example: "application/pdf"
            file_size:
              type: integer
              example: 245760
            download_url:
              type: string
              example: "http://127.0.0.1:8000/api/files/1/download"
            created_at:
              type: string
              format: date-time
              example: "2026-09-23T10:00:00.000000Z"

