      type: object
      properties:
        id:
          type: integer
          example: 1
        task_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 10
        content:
          type: string
          nullable: true
          example: "Completed the requested implementation."
        status:
          type: string
          enum: [pending, approved, rejected]
          example: "pending"
        created_at:
          type: string
          format: date-time
          example: "2026-09-23T10:00:00.000000Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-09-23T10:00:00.000000Z"

    SubmissionAttachment:
      type: object
      properties:
        id:
          type: integer
          example: 1
        submission_id:
          type: integer
          example: 1
        file_path:
          type: string
          example: "submissions/file.pdf"
        file_name:
          type: string
          example: "document.pdf"
        created_at:
          type: string
          format: date-time
          example: "2026-09-23T10:00:00.000000Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-09-23T10:00:00.000000Z"

    SubmissionReview:
      type: object
      properties:
        id:
          type: integer
          example: 1
        submission_id:
          type: integer
          example: 1
        reviewed_by:
          type: integer
          example: 2
        status:
          type: string
          enum: [approved, rejected]
          example: "approved"
        comment:
          type: string
          nullable: true
          example: "Great work!"
        created_at:
          type: string
          format: date-time
          example: "2026-09-23T10:00:00.000000Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-09-23T10:00:00.000000Z"

