paths:
  /api/auth/login:
    post:
      summary: Login (This route is allowed for all roles) 📱
      operationId: login
      tags:
      - Authentication
      parameters:
      - in: header
        name: Accept
        required: true
        schema:
          type: string
          default: application/json
        example: application/json
      - in: header
        name: Accept-Language
        required: false
        schema:
          type: string
          enum:
          - ar
          - en
      - in: query
        name: lang
        required: false
        description: Language for response translation (e.g. ar, en)
        schema:
          type: string
          enum:
          - ar
          - en
          default: en
        example: en
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  example: noni@gmail.com
                password:
                  type: string
                  example: secret123
      responses:
        "200":
          description: Logged in successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Logged in successfully.
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      token_type:
                        type: string
                        example: bearer
                      expires_in:
                        type: string
                        example: 24 hours
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 6
                          name:
                            type: string
                            example: Noran Baligh
                          email:
                            type: string
                            format: email
                            example: noran@gmail.com
                          phone:
                            type: string
                            nullable: true
                            example: "01019018137"
                          employee_code:
                            type: string
                            nullable: true
                            example: EMP-2026-24271
                          job_title:
                            type: string
                            nullable: true
                            example: Frontend Developer
                          employment_type:
                            type: string
                            nullable: true
                            example: Part-time
                          start_date:
                            type: string
                            format: date
                            nullable: true
                            example: 2026-09-01
                          status:
                            type: string
                            nullable: true
                            example: Active
                          address:
                            type: string
                            nullable: true
                            example:
                          avatar_url:
                            type: string
                            nullable: true
                            example: http://127.0.0.1:8000/api/files/2/download
                          role:
                            type: string
                            example: Employee
                          role_label:
                            type: string
                            nullable: true
                            example: Employee
                          locale:
                            type: string
                            example: en
                          permissions:
                            type: array
                            items:
                              type: string
                            example:
                            - View Profile
                            - Update Profile
                            - View Departments
                            - Update Task Progress
                            - Update Task Status
                            - Create Submission
                            - Attach File to Submission
                            - View Submission
                            - Resubmit Submission
                            - View Active Locations
                            - Check-in / Check-out
                            - View Personal Attendance History
                            - View Own Goals
                            - Create Goal
                            - Update Goal
                            - Update Goal Progress
                            - Complete Goal
                            - View Personal Evaluation
                            - Personal Performance Dashboard
                            - View Leave Types
                            - View Leave Balances
                            - View Own Leave Requests
                            - Create Leave Request
