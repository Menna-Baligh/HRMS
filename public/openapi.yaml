      summary: List deductions and penalties (All Roles) 📱
      description: Retrieve a paginated list of financial deductions and penalties. Users with `Owner` or `HR` role can view all company records; regular employees can only view their own deductions. Requires `view deductions` permission.
      operationId: getFinancialDeductions
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
        - in: header
          name: Accept-Language
          required: false
          schema:
            type: string
            enum: [ar, en]
            default: ar
          description: Preferred language for response messages.
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
          description: Pagination page number.
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            default: 10
          description: Number of items per page.
      responses:
        '200':
          description: Deductions list retrieved successfully.
