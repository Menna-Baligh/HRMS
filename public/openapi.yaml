        "422":
          description: Validation error or invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Validation error
              examples:
                invalidCredentials:
                  summary: Invalid Credentials
                  value:
                    success: false
                    message: The email address field is required. The password field is required.
        "429":
          description: Too Many Requests (Throttle limit exceeded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
