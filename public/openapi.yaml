  /api/financial/payroll:
    get:
      tags:
        - Financials
      summary: Get company payroll  (Owner / HR)
      description: Calculates or retrieves the entire company payroll  for a given month (`month_year`). Indicates whether the month is finalized (`is_month_finalized`) and returns localized status messages. Requires `view payroll` permission.
      operationId: getFinancialPayroll
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
        - in: header
          name: Accept-Language
          required: false
          schema:
            type: string
            enum: [ar, en]
            default: ar
          description: Preferred language for response messages.
        - in: query
          name: month_year
          required: false
          schema:
            type: string
            pattern: '^\\d{4}-\\d{2}$'
            example: "2026-09"
          description: "Target month in YYYY-MM format. Defaults to current month."
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
          description: Pagination page number.
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            default: 10
          description: Number of items per page.
      responses:
        '200':
          description: Payroll calculation retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollListResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500ServerError'

  /api/financial/payroll/finalize:
    post:
      tags:
        - Financials
      summary: Finalize and close monthly payroll (Owner / HR)
      description: Finalizes and locks the company payroll for the specified month (`month_year`). Deducts approved advance installments and queued deductions, applies bonuses, creates permanent payroll records, and notifies all employees. Returns HTTP 201 with created payroll entries, or HTTP 200 with an empty list if already finalized. Requires `run payroll` permission.
      operationId: finalizeFinancialPayroll
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
        - in: header
          name: Accept-Language
          required: false
          schema:
            type: string
            enum: [ar, en]
            default: ar
          description: Preferred language for response messages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizePayrollRequest'
      responses:
        '201':
          description: Payroll finalized successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizePayrollResponse'
        '200':
          description: Payroll already finalized for all employees.
          content:
            application/json:
              example:
                success: true
                message: "All employees payrolls for this month are already finalized."
                data: []
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500ServerError'

  /api/financial/payroll/{payroll}/payslip:
    get:
      tags:
        - Financials
      summary: Download employee payslip PDF (Owner / HR)
      description: Generates and streams a branded PDF payslip document for a specific finalized payroll record (`{payroll}`). Includes salary breakdown, allowances, bonuses, deductions, and loan repayments. Requires `view payroll` permission.
      operationId: downloadFinancialPayslip
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: payroll
          required: true
          schema:
            type: integer
          description: Unique ID of the finalized payroll record.
          example: 12
        - in: header
          name: Accept-Language
          required: false
          schema:
            type: string
            enum: [ar, en]
            default: ar
          description: Preferred language for PDF localized labels.
      responses:
        '200':
          description: Payslip PDF document download.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="payslip_Ahmed Hassan_2026-09.pdf"'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500ServerError'

