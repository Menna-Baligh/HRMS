  /api/financial/advances:
    get:
      tags:
        - Financials
      summary: List salary advance requests (All Roles) 📱
      description: Retrieve a paginated list of salary advance requests. If the authenticated user has the `Owner` or `HR` role, all advance requests are returned. Regular employees only see their own advance requests.
      operationId: getFinancialAdvances
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
        - in: header
          name: Accept-Language
          required: false
          schema:
            type: string
            enum: [ar, en]
            default: ar
          description: Preferred language for response messages.
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
          description: Pagination page number.
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            default: 10
          description: Number of items per page.
      responses:
        '200':
          description: Salary advance requests retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryAdvanceListResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500ServerError'

    post:
      tags:
        - Financials
      summary: Request a salary advance (All Roles)📱
      description: Submit a new salary advance request. Automatically calculates `monthly_deduction = requested_amount / repayment_months`, sets `status` to `pending`, and dispatches notification jobs to all Owner and HR administrators. Requires `create advance` permission.
      operationId: createFinancialAdvance
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
        - in: header
          name: Accept-Language
          required: false
          schema:
            type: string
            enum: [ar, en]
            default: ar
          description: Preferred language for response messages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreSalaryAdvanceRequest'
      responses:
        '201':
          description: Salary advance request created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryAdvanceSingleResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500ServerError'

  /api/financial/advances/{advance}/status:
    put:
      tags:
        - Financials
      summary: Update salary advance request status (HR / Owner)
      description: Update the status of a salary advance to `approved` or `rejected`. Requires `manage advance status` permission. Automatically dispatches a push notification to the requesting employee.
      operationId: updateFinancialAdvanceStatus
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: advance
          required: true
          schema:
            type: integer
          description: Unique ID of the salary advance request.
          example: 3
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          example: application/json
        - in: header
          name: Accept-Language
          required: false
          schema:
            type: string
            enum: [ar, en]
            default: ar
          description: Preferred language for response messages.
