    post:
      summary: "Create a new employee (Allowed for Owner and HR roles)"
      description: "Creates a new employee account and sends an invitation email. Department is required for Employee and Manager roles, optional for HR. Send `lang=ar` or `lang=en` as a query parameter."
      operationId: storeEmployee
      tags:
      - Employees
      security:
      - bearerAuth: []
      parameters:
      - in: header
        name: Accept
        required: true
        schema:
          type: string
          default: application/json
        example: application/json
      - in: header
        name: Accept-Language
        required: false
        schema:
          type: string
          enum:
          - ar
          - en
      - in: query
        name: lang
        required: false
        description: Language for response translation (e.g. ar, en)
        schema:
          type: string
          enum:
          - ar
          - en
          default: en
        example: en
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              - password
              - role
              - job_title
              - employment_type
              - start_date
              properties:
                name:
                  type: string
                  maxLength: 255
                  example: Jane Doe
                email:
                  type: string
                  format: email
                  example: jane.doe@example.com
                password:
                  type: string
                  minLength: 8
                  example: Password123!
                role:
                  type: string
                  enum:
                  - HR
                  - Manager
                  - Employee
                  example: Employee
                job_title:
                  type: string
                  maxLength: 255
                  example: Software Engineer
                permissions:
                  type: array
                  items:
                    type: string
                  example:
                  - View Profile
                  - Update Task Progress
                employment_type:
                  type: string
                  enum:
                  - Full-time
                  - Part-time
                  - Contract
                  example: Full-time
                start_date:
                  type: string
                  format: date
                  example: 2026-09-22
                department_id:
                  type: integer
                  nullable: true
                  description: Required if role is Employee or Manager. Optional/Null for HR.
                  example: 1
                phone:
                  type: string
                  maxLength: 20
                  nullable: true
                  example: "+201234567890"
                address:
                  type: string
                  nullable: true
                  example: Cairo, Egypt
                locale:
                  type: string
                  enum: [ar, en]
                  nullable: true
                  example: en
      responses:
        "201":
          description: Employee created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Employee created successfully.
                  data:
                    type: object
                    properties:
